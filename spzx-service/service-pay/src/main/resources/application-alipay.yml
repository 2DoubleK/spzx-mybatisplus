server:
  port: 8515  # 支付服务端口
spring:
  application:
    name: service-pay  # ✅ 修正：服务名改为service-pay（之前是service-part）
  config:
    import: "optional:classpath:/application.yml"
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848  # Nacos注册中心地址
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/db_spzx?characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
  data:
    redis:
      host: localhost
      port: 6379

# 支付宝支付配置
spzx:
  alipay:
    alipay_url: https://openapi.alipaydev.com/gateway.do  # 支付宝沙箱网关
    app_id: 2021001163617452                          # 你的应用ID
    app_private_key: 
    alipay_public_key: 
    return_payment_url: http://ggkt2.v1.idcfengye.com/#/pages/money/paySuccess  # 同步回调（前端页面）
    notify_payment_url: http://ggkt1.v1.idcfengye.com/api/order/alipay/callback/notify  # 异步回调（后端接口）

# MinIO配置
minio:
  endpoint: http://169.254.19.248:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: spzx

# Dubbo配置
dubbo:
  application:
    name: service-pay  # ✅ 修正：Dubbo应用名改为service-pay（之前是service-part）
    register-mode: interface
    qos-enable: true
    qos-port: 44373
    service-discovery:
      migration: FORCE_INTERFACE # 强制接口级发现，避免Rest协议问题
  registry:
    address: nacos://localhost:8848  # Dubbo注册到Nacos
  protocol:
    name: dubbo
    port: 20885 # 修改端口，避免冲突
    serialization: fastjson2 # 设置序列化方式，避免默认Hessian2问题
  consumer:
    check: false     # 启动时不检查提供者是否存在
    timeout: 3000    # 消费超时时间

# 日志配置（调试Dubbo）
logging:
  level:
    org.apache.dubbo: DEBUG
    org.apache.dubbo.remoting: DEBUG