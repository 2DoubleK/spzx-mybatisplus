server:
  port: 8511  # HTTP 端口（仅用于本服务的 Controller，如有）

spring:
  application:
    name: service-product
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/db_spzx?characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
  data:
    redis:
      host: localhost
      port: 6379

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.atguigu.spzx.model.entity.product
  global-config:
    db-config:
      id-type: ASSIGN_ID
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    local-cache-scope: STATEMENT
    default-executor-type: REUSE

minio:
  endpoint: http://169.254.19.248:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: spzx

dubbo:
  application:
    name: service-product
    qos-enable: true
    qos-port: 33333
    register-mode: interface # Explicitly register only interface level
    migration: FORCE_INTERFACE # Force interface-level discovery to avoid RestProtocol issues
  protocol:
    name: dubbo     # ✅ 明确使用 Dubbo RPC
    port: -1        # ✅ 随机端口
  registry:
    address: nacos://localhost:8848
logging:
  level:
    org.apache.dubbo: DEBUG # 开启Dubbo调试日志
    org.apache.dubbo.remoting: DEBUG # 开启通信层日志